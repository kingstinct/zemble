name: Release

on:
  workflow_dispatch: 
  push:
    paths: 
      - '.changeset/**'
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        os: [ubuntu-latest, macos-latest]
    with:
      os: ${{ matrix.os }}
    secrets: 
      TEST_PRIVATE_KEY: ${{ secrets.TEST_PRIVATE_KEY }}
      TEST_PUBLIC_KEY: ${{ secrets.TEST_PUBLIC_KEY }}
  release:
    needs: test
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    env:
      MONGOMS_DISABLE_POSTINSTALL: true
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cardinalby/export-env-action@4f48c4676cf6ed6f46e30899ee987ce695da7c80 # 2.2.3
        with:
          envFile: .env.github

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # ubuntu-latest (24.04) ships npm 10.9.8, trusted publishing needs >= 11.5.1.
      # Can be removed once ubuntu-latest moves to 26.04, which ships npm 11.17.0.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - run: HUSKY=0 bun install --ignore-scripts
        env:
          HUSKY: 0
          
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # This expects you to have a script called release which does a build for your packages and calls changeset publish
          publish: bun run changeset-release
          createGithubReleases: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}