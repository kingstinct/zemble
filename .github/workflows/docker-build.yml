# This is a basic workflow to help you get started with Actions

name: Docker Build

on:
  workflow_call:
    secrets:
      github-token:
        required: true
      SLACK_WEBHOOK:
        required: false
    inputs:
      envFile:
        required: false
        type: string
        default: .env.github
      discordWebhook:
        required: false
        type: string
      baseImageSuffix:
        default: -slim
        type: string
      dockerBuildArgs:
        required: false
        type: string
      dockerImageTags:
        required: false
        type: string
        default: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cardinalby/export-env-action@4f48c4676cf6ed6f46e30899ee987ce695da7c80 # 2.2.3
        with:
          envFile: ${{ inputs.envFile }}

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github-token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          baseImage: BASE_IMAGE=oven/bun:${{ env.BUN_VERSION || 'latest' }}${{ inputs.baseImageSuffix }}
        with:
          push: true
          context: .
          build-args: ${{ inputs.dockerBuildArgs || env.baseImage }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ inputs.dockerImageTags }}

      - uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        if: ${{ failure() && inputs.discordWebhook }}
        with:
          webhook: ${{ inputs.discordWebhook }}

      - uses: rtCamp/action-slack-notify@33ca3be66c6f378fe1610fd1d5258632dbed5e58 # v2.4.0
        if: ${{ failure() && env.SLACK_WEBHOOK }}